services:

  mysql:
    image: mysql:8.4
    container_name: eveoracle-db

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DBNAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "mysql"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: eveoracle-backend

    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: mysql+aiomysql://${DB_USER}:${DB_PASSWORD}@mysql/${DB_DBNAME}
      

    ports:
      - "8080:8080"

    volumes:
      - ./backend/app:/app/app
      - ./shared:/app/shared
      - ./static:/static:ro


  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
  
    container_name: eveoracle-worker
  
    restart: unless-stopped
  
    env_file:
      - .env
  
    environment:
      DATABASE_URL: mysql+aiomysql://${DB_USER}:${DB_PASSWORD}@mysql/${DB_DBNAME}
  
    depends_on:
      mysql:
        condition: service_healthy
  
    volumes:
      - ./worker:/app/worker
      - ./shared:/app/shared
      - ./static:/static


  frontend:
    build:
      context: ./frontend

    container_name: eveoracle-frontend

    depends_on:
      - backend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./static:/static:ro

volumes:
  mysql_data: